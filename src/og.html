<!doctype html>
<!-- Макет зображення для соцмереж (Open Graph), 1200×630. Не сторінка сайту:
     scripts/make-og.js відкриває його в headless-браузері й зберігає знімок у assets/images/og.png -->
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Open Graph — ОсьЯ</title>
<style>
  @font-face { font-family: "Lora"; font-weight: 500 700; src: url("../assets/fonts/lora-cyrillic.woff2") format("woff2"); unicode-range: U+0400-04FF, U+2116; }
  @font-face { font-family: "Lora"; font-weight: 500 700; src: url("../assets/fonts/lora-latin.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  @font-face { font-family: "Golos Text"; font-weight: 400 700; src: url("../assets/fonts/golos-text-cyrillic.woff2") format("woff2"); unicode-range: U+0400-04FF; }
  @font-face { font-family: "Golos Text"; font-weight: 400 700; src: url("../assets/fonts/golos-text-latin.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400 500; src: url("../assets/fonts/jetbrains-mono-cyrillic.woff2") format("woff2"); unicode-range: U+0400-04FF, U+2116; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400 500; src: url("../assets/fonts/jetbrains-mono-latin.woff2") format("woff2"); unicode-range: U+0000-00FF; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f6f3ec; color: #14213d; font-family: "Golos Text", sans-serif; position: relative; }
  .waves { position: absolute; inset: 0; background: #14213d; opacity: 0.06; -webkit-mask: url("../assets/images/guilloche-waves.svg") repeat; -webkit-mask-size: 240px 48px; }
  .wrap { position: relative; display: grid; grid-template-columns: 1fr 470px; gap: 56px; align-items: center; height: 100%; padding: 0 80px; }
  .logo { font-family: "Lora", serif; font-weight: 700; font-size: 44px; }
  .holo { background: linear-gradient(115deg, #0d9488, #6d28d9, #db2777, #c2410c); -webkit-background-clip: text; color: transparent; }
  .sub { font-family: "JetBrains Mono", monospace; font-size: 18px; color: #58606f; margin-top: 4px; }
  h1 { font-family: "Lora", serif; font-size: 68px; line-height: 1.05; margin-top: 44px; letter-spacing: -0.01em; }
  p { font-size: 26px; line-height: 1.4; color: #58606f; margin-top: 24px; }
  .card { background: #fffdf8; border: 1px solid #cfc8b8; border-radius: 10px; padding: 30px; box-shadow: 0 30px 60px -30px rgba(14,22,40,.55); transform: rotate(-2deg); position: relative; }
  .top { display: flex; justify-content: space-between; font-family: "JetBrains Mono", monospace; font-size: 14px; color: #58606f; border-bottom: 1px solid #cfc8b8; padding-bottom: 12px; }
  .row { display: flex; gap: 22px; margin-top: 22px; }
  .row img { width: 116px; height: 145px; border: 1px solid #cfc8b8; border-radius: 4px; }
  .k { font-family: "JetBrains Mono", monospace; font-size: 12px; color: #58606f; margin-top: 10px; }
  .k:first-child { margin-top: 0; }
  .v { font-family: "Lora", serif; font-weight: 700; font-size: 24px; }
  .v2 { font-size: 19px; font-weight: 600; }
  .mrz { font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: .18em; color: #58606f; margin-top: 22px; border-top: 1px solid #cfc8b8; padding-top: 12px; white-space: nowrap; overflow: hidden; }
  .stamp { position: absolute; right: -18px; bottom: 54px; transform: rotate(-11deg); color: #b63a22; border: 4px solid currentColor; border-radius: 40px; padding: 10px 22px; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; letter-spacing: .2em; outline: 1.5px solid currentColor; outline-offset: -10px; }
  .dot { position: absolute; left: 112px; top: 190px; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(115deg, #0d9488, #6d28d9, #db2777, #c2410c); display: grid; place-items: center; color: #fff; font-family: "Lora", serif; font-weight: 700; font-size: 22px; border: 3px solid #fffdf8; }
</style>
</head>
<body>
  <div class="waves"></div>
  <div class="wrap">
    <div>
      <div class="logo">Ось<span class="holo">Я</span></div>
      <div class="sub">мій цифровий профіль</div>
      <h1>Портфоліо, оформлене як&nbsp;документ</h1>
      <p>Конструктор без реєстрації: бланк, кольори, розділи й готовий файл PDF або HTML.</p>
    </div>
    <div class="card">
      <div class="top"><span>Цифровий профіль</span><span>№ 000 247</span></div>
      <div class="row">
        <img src="../assets/images/portrait.svg" alt="">
        <div>
          <div class="k">Прізвище</div><div class="v">Коваль</div>
          <div class="k">Ім’я</div><div class="v">Олена</div>
          <div class="k">Фах</div><div class="v2">UX-дизайнерка</div>
          <div class="k">Місто</div><div class="v2">Львів</div>
        </div>
      </div>
      <div class="dot">Я</div>
      <div class="mrz">P&lt;UKRKOVAL&lt;&lt;OLENA&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</div>
      <div class="stamp">ПЕРЕВІРЕНО</div>
    </div>
  </div>
</body>
</html>
