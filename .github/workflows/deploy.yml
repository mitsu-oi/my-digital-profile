# CI/CD «ОсьЯ»: після кожного push у main — збірка й перевірка сайту, і лише якщо все добре — деплой на Vercel.
# Потрібні секрети репозиторію (Settings → Secrets and variables → Actions → New repository secret):
#   VERCEL_TOKEN       — токен Vercel (Account Settings → Tokens)
#   VERCEL_ORG_ID      — ідентифікатор акаунта (Account Settings → General → Vercel ID; для команди — Team ID)
#   VERCEL_PROJECT_ID  — ідентифікатор проєкту (Project → Settings → General → Project ID)
# Автодеплой самого Vercel із Git вимкнено у vercel.json, тож сайт оновлює тільки цей конвеєр.
name: CI/CD Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # запуск вручну з вкладки Actions

permissions:
  contents: read

# якщо під час деплою надійшов новий push, старий запуск скасовується
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # ---------- CI: збірка та перевірки ----------
  check:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pages, illustrations and CSS
        run: npm run build

      - name: Check scripts, data, links and SEO tags
        run: npm run check

      # зібрані файли мають збігатися із закоміченими: інакше на сайт потрапила б застара версія
      - name: Make sure built files are committed
        run: git diff --exit-code -- '*.html' css/ assets/images/ robots.txt || (echo "::error::Зібрані файли відрізняються від закомічених. Запустіть npm run build і закомітьте результат." && exit 1)

  # ---------- CD: деплой на Vercel (лише якщо перевірки пройдено) ----------
  deploy:
    name: Deploy to Vercel
    needs: check
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
